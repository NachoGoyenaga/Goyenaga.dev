<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. FAVICON SVG VECTORIAL (Cero pixelado en cualquier resolución o pantalla Retina) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Metadatos Básicos -->
    <title>Ignacio Goyenaga | Full Stack Engineer</title>
    <meta 
      name="description" 
      content="Portafolio profesional de Ignacio Goyenaga. Ingeniero en Sistemas y Full Stack Engineer especializado en .NET (C#), React, SQL Server y Azure en Costa Rica." 
    />
    <meta name="author" content="Ignacio Goyenaga" />
    <meta name="theme-color" content="#090b0a" />

    <!-- 2. OPEN GRAPH / FACEBOOK / LINKEDIN / WHATSAPP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="goyenaga.dev" />
    <meta property="og:url" content="https://goyenaga.dev/" />
    <meta property="og:title" content="Ignacio Goyenaga | Full Stack Engineer" />
    <meta 
      property="og:description" 
      content="Ingeniero en Sistemas enfocado en soluciones de software Full Stack (.NET, React, SQL Server, Azure)." 
    />
    <!-- Ruta absoluta obligatoria para que los rastreadores de WhatsApp/LinkedIn la descarguen -->
    <meta property="og:image" content="https://goyenaga.dev/og-image.png" />
    <meta property="og:image:secure_url" content="https://goyenaga.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ignacio Goyenaga — Portafolio Profesional" />

    <!-- 3. TWITTER CARDS / X (Para que se expanda en formato tarjeta grande) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://goyenaga.dev/" />
    <meta name="twitter:title" content="Ignacio Goyenaga | Full Stack Engineer" />
    <meta 
      name="twitter:description" 
      content="Ingeniero en Sistemas enfocado en soluciones de software Full Stack (.NET, React, SQL Server, Azure)." 
    />
    <meta name="twitter:image" content="https://goyenaga.dev/og-image.png" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" 
      rel="stylesheet" 
    />
  </head>
  <body class="bg-[#0a0a0a] text-neutral-200 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
